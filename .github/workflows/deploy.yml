name: Deploy Vite site to Pages

on:
  # Запускається при кожному пуші в гілку main
  push:
    branches: ["main"]

  # Дозволяє запускати деплой вручну з вкладки Actions
  workflow_dispatch:

# Дозволи для запису в GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Дозволяє лише один активний деплой одночасно
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Папка, куди Vite збирає проєкт (за замовчуванням dist)
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4